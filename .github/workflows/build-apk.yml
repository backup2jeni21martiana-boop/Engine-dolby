name: Build Android Native APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Extract Project ZIP
        run: |
          mkdir -p native_project
          unzip -o *.zip -d native_project || true
          # Menyalin seluruh berkas ke root pengerjaan
          cp -r native_project/* . || true
          cp -r native_project/*/* . || true

      - name: Auto Init and Build with Gradle Global
        run: |
          gradle init --type android-application || true
          gradle assembleDebug --no-daemon
          
      - name: Upload APK Result
        uses: actions/upload-artifact@v4
        with:
          name: HDREngine-Native-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
